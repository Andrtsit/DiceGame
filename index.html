<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="queries.css">
    <script defer src="app.js"></script>
    <title>DiceGame</title>
  </head>
  <body>
    <button id="reset">RESET</button>
    <main id="main">
         <section class="player player-one">
          <div class="score">
            <h1>Player 1</h1>
            <p class="score-player-one">0</p>
          </div>
          <div class="current-score">
            <p class="current-score-player-one">0</p>
          </div>
         </section>
         <section class="player player-two">
          <div class="score">
            <h1>Player 2</h1>
            <p class="score-player-two">0</p>
          </div>
          <div class="current-score">
            <p class="current-score-player-two">0</p>
          </div>
        </section>
        <button id="dice">Roll 🎲</button>
        <button id="collect">Collect</button>
      </main>
  </body>
</html>
